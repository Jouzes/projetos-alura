<nav class="navbar">
  <span class="logo" aria-hidden="true">✎</span>
  <h1>Texto compartilhado por websocket</h1>
</nav>

<main class="workspace">
  <section class="note" aria-labelledby="note-title">
    <header class="note-header">
      <h2 id="note-title">Suas anotações</h2>
    </header>
    <textarea id="note-text" placeholder="Comece a escrever aqui…" spellcheck="true" (input)="sendText($event)" [value]="text()"></textarea>
  </section>
</main>

<div class="status" role="status">
  <span class="status-dot" aria-hidden="true" [class.online]="conected()"></span>
  {{conected() ? 'Conectado' : 'Desconectado'}}
</div>
